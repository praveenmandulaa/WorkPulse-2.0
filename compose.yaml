
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: workpulse_docker
      MARIADB_USER: workpulse
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - workpulse

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: workpulse_docker
      DB_USERNAME: workpulse
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    command: >
      sh -c "if [ ! -f vendor/autoload.php ]; then
      composer install --no-interaction --prefer-dist;
      fi;
      php-fpm"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - workpulse

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - workpulse

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "if [ ! -d node_modules/vite ]; then
      npm ci;
      fi;
      npm run dev -- --host 0.0.0.0"
    networks:
      - workpulse

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:

networks:
  workpulse:
    driver: bridge
